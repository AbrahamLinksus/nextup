[project]
name = "jakes-assistant"
version = "0.1.0"
description = "Personal assistant that ingests Notion/Gmail, triages each item, auto-acts on high-confidence obligations and queues the rest"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=25.1",
    "apscheduler>=3.11",
    # Deterministic relative-date resolution ("next Friday" -> a real date) before
    # anything reaches an LLM. The whole date-normalization stage is built around
    # this handling the common cases with no model call at all.
    "dateparser>=1.2",
    # Only imported when LLM_PROVIDER=anthropic; the Ollama path needs no SDK.
    "anthropic>=0.69",
    # Calendar/Gmail/Slack destinations are reached through MCP servers rather
    # than bespoke API clients (design log, Action execution).
    "mcp>=1.2",
    # Verifying the OIDC token Pub/Sub attaches to every push delivery. The
    # crypto extra is what makes RS256 verification possible at all -- without
    # it PyJWT can read a token but cannot check who signed it.
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
assistant = "assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: needs a live Postgres with pgvector (skipped when unreachable)",
    "llm: exercises a real model (seconds, not milliseconds)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
